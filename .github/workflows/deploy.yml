# Build dist/ and deploy it to Cloudflare Pages.
#
# Deploys from master, this repo's default branch. Everything the phone sees
# comes from here, so pushing to master is publishing.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN     a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID    from the Cloudflare dashboard sidebar
#
# Required Pages environment variable, set once in the dashboard, encrypted:
#   APP_PASSWORD             the shared password the gate checks
#
# APP_PASSWORD is deliberately NOT a GitHub secret: it belongs to the running
# worker, not to the build, and nothing in this workflow should ever see it.

name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'public/**'
      - 'tools/**'
      - 'test/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# A push while a deploy is running supersedes it; never race two deploys.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No install step: the app and its tests have zero dependencies.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Standard library only, likewise.

      # The password gate is the only thing between the URL and the recipes,
      # and every way it fails is silent. It gets tested before it ships.
      - name: Tests
        run: |
          node test/db.test.js
          node test/sw.test.js
          node test/worker.test.js
          node test/drive.test.js

      # Copies public/ to dist/ and stamps sw.js's SHELL_VERSION with this
      # commit, so installed phones cannot keep serving the previous deploy.
      - name: Build
        run: python tools/build.py --commit "$GITHUB_SHA"

      # Every required file present and non-empty, the manifest parses and its
      # icons exist, SHELL_VERSION stamped with this commit, no dev leftovers,
      # and nothing in dist/ missing from the service worker's precache list.
      # Reports every problem at once.
      - name: Verify the deploy artifact
        run: python tools/verify_dist.py --expect-commit "$GITHUB_SHA"

      # wrangler is invoked directly rather than through wrangler-action.
      # The action produced "Running Wrangler Commands / Wrangler Action
      # completed" with no wrangler output and no deployment URL, and still
      # reported success -- a deploy that silently does nothing is worse than
      # one that fails. npx prints everything and a non-zero exit fails the job.
      - name: List existing Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages project list

      # Already-exists is the normal case and exits non-zero, hence the guard.
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create recipes-app             --production-branch=master || echo "project already exists, continuing"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist             --project-name=recipes-app --branch=master
